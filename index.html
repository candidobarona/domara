<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOMARA – Sports calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23000'/%3E%3Ccircle cx='24' cy='24' r='15' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cellipse cx='24' cy='24' rx='15' ry='7' transform='rotate(-35 24 24)' fill='none' stroke='%2310b981' stroke-width='3'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.fade{animation:f .22s ease-out}@keyframes f{from{opacity:0}to{opacity:1}}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #10b981;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body class="bg-zinc-50 dark:bg-black text-zinc-900 dark:text-zinc-100 min-h-screen">

<!-- Sticky header: logo, view switcher, Today, theme, and (daily view) date strip -->
<header class="sticky top-0 z-30 backdrop-blur bg-zinc-50/90 dark:bg-black/90 border-b border-zinc-200 dark:border-zinc-800">
  <div class="max-w-6xl mx-auto px-3 py-2 flex items-center gap-2">
    <a href="#" class="flex items-center gap-2 shrink-0" aria-label="DOMARA">
      <svg class="w-8 h-8" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="3"/><ellipse cx="24" cy="24" rx="16" ry="7.5" transform="rotate(-35 24 24)" stroke="#10b981" stroke-width="3"/></svg>
      <span class="hidden sm:inline font-bold tracking-[.25em] text-lg">DOMARA</span>
    </a>
    <div class="flex-1 flex justify-center">
      <div class="inline-flex p-0.5 rounded-full bg-zinc-200 dark:bg-zinc-900 text-sm" role="tablist">
        <button data-v="day">Day</button><button data-v="week">Week</button><button data-v="month">Month</button>
      </div>
    </div>
    <button data-today class="px-3 py-1.5 rounded-full bg-emerald-500 text-black text-sm font-semibold hover:bg-emerald-400 transition">Today</button>
    <button id="refresh" data-refresh class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 transition" aria-label="Refresh data" title="Refresh data"></button>
    <button id="theme" class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 transition" aria-label="Toggle theme"></button>
  </div>
  <div id="strip" class="max-w-6xl mx-auto px-3 pb-2"></div>
<div id="bar" class="h-0.5 bg-emerald-500 animate-pulse"></div>
</header>

<div class="max-w-6xl mx-auto px-3">
  <!-- Filters -->
  <div class="pt-3 flex flex-col gap-2">
    <div class="relative">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" id="sicon"></span>
      <input id="q" type="search" placeholder="Search team or league" class="w-full pl-9 pr-3 py-2 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-sm placeholder-zinc-500">
    </div>
    <div id="sports" class="flex gap-2 overflow-x-auto noscroll"></div>
    <div id="chips" class="flex gap-2 overflow-x-auto noscroll pb-1"></div>
  </div>
  <div id="status"></div>
  <main id="main" class="py-3"></main>
</div>

<footer class="max-w-6xl mx-auto px-3 pb-8"><button id="pill" data-dg class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs text-zinc-500 border border-zinc-200 dark:border-zinc-800 hover:border-emerald-500 transition"></button></footer>
<div id="dg" class="fixed inset-0 z-50 hidden"><div data-dgclose class="absolute inset-0 bg-black/60"></div>
  <div id="dgc" class="fade absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[92vw] max-w-md max-h-[80vh] overflow-y-auto rounded-2xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 p-4"></div></div>

<!-- Day drawer (month view): bottom sheet on mobile, side panel on desktop -->
<div id="dr" class="fixed inset-0 z-40 hidden">
  <div data-close class="absolute inset-0 bg-black/60"></div>
  <aside class="fade absolute bottom-0 md:top-0 md:right-0 w-full md:w-96 max-h-[80vh] md:max-h-none md:h-full overflow-y-auto bg-zinc-50 dark:bg-zinc-950 border-t md:border-l border-zinc-200 dark:border-zinc-800 rounded-t-3xl md:rounded-none p-4" id="drc"></aside>
</div>

<script>
/* ---------- DATA SOURCE ----------
   events.json is generated by update_schedule.js (GitHub Action, The Odds API). This page contains NO API keys.
   If events.json does not exist yet, built-in sample events are shown. */
/* ---------- DATA ---------- */
const SP={fb:{n:'Football',c:'#10b981'},bk:{n:'Basketball',c:'#f97316'},af:{n:'American Football',c:'#3b82f6'},rg:{n:'Rugby',c:'#a855f7'}};
// h = estimated event duration in hours (used for the Google Calendar end time).
const COMPS=[
 {id:'laliga',sp:'fb',n:'LaLiga',s:'LaLiga',h:2},
 {id:'pl',sp:'fb',n:'English Premier League',s:'Premier League',h:2},
 {id:'sa',sp:'fb',n:'Serie A',s:'Serie A',h:2},
 {id:'l1',sp:'fb',n:'Ligue 1',s:'Ligue 1',h:2},
 {id:'bl',sp:'fb',n:'Bundesliga',s:'Bundesliga',h:2},
 {id:'pt',sp:'fb',n:'Liga Portuguesa',s:'Liga Portugal',h:2},
 {id:'ucl',sp:'fb',n:'UEFA Champions League',s:'Champions League',h:2},
 {id:'uel',sp:'fb',n:'UEFA Europa League',s:'Europa League',h:2},
 {id:'unl',sp:'fb',n:'UEFA Nations League',s:'Nations League',h:2},
 {id:'arg',sp:'fb',n:'Liga Profesional de Fútbol Argentino',s:'Liga Argentina',h:2},
 {id:'bra',sp:'fb',n:'Brasileirão',s:'Brasileirão',h:2},
 {id:'nba',sp:'bk',n:'NBA',s:'NBA',h:2.5},
 {id:'nfl',sp:'af',n:'NFL',s:'NFL',h:3},
 {id:'rwc',sp:'rg',n:'Rugby World Cup',s:'Rugby World Cup',h:2},
 {id:'6n',sp:'rg',n:'Six Nations',s:'Six Nations',h:2},
 {id:'trc',sp:'rg',n:'The Rugby Championship',s:'Rugby Championship',h:2},
 {id:'nc',sp:'rg',n:'Nations Championship',s:'Nations Champ.',h:2}
];
// Offline fallback sample: [competition, day offset from this week's Monday, UTC time, title]
const RAW=[
 ['nba',-12,'01:00','Golden State Warriors vs Phoenix Suns'],
 ['pl',-9,'15:00','Arsenal vs Chelsea – Matchday 12'],
 ['bl',-8,'17:30','Bayern Munich vs Borussia Dortmund – Matchday 11'],
 ['nfl',-8,'18:00','Kansas City Chiefs vs Buffalo Bills'],
 ['arg',-6,'22:00','River Plate vs Boca Juniors'],
 ['laliga',-4,'20:00','Valencia vs Athletic Club – Matchday 13'],
 ['ucl',-3,'20:00','Atlético Madrid vs Napoli'],
 ['laliga',0,'20:00','Real Madrid vs FC Barcelona – Matchday 14'],
 ['sa',0,'19:45','Inter vs Napoli – Matchday 12'],
 ['ucl',1,'20:00','PSG vs Bayern Munich'],
 ['ucl',1,'20:00','Liverpool vs Inter'],
 ['uel',2,'17:45','Roma vs Ajax'],
 ['uel',2,'20:00','Aston Villa vs Olympique Lyon'],
 ['nba',2,'00:30','Los Angeles Lakers vs Boston Celtics'],
 ['unl',3,'19:45','Spain vs France'],
 ['pt',3,'19:15','Benfica vs Sporting CP – Matchday 12'],
 ['l1',4,'20:00','PSG vs Marseille – Matchday 13'],
 ['bra',4,'22:00','Flamengo vs Palmeiras'],
 ['pl',5,'12:30','Liverpool vs Manchester City – Matchday 13'],
 ['laliga',5,'20:00','Atlético Madrid vs Sevilla – Matchday 14'],
 ['nc',5,'15:00','New Zealand vs Ireland'],
 ['trc',5,'17:40','Australia vs Argentina'],
 ['nfl',6,'18:25','Dallas Cowboys vs Philadelphia Eagles'],
 ['sa',6,'19:45','Juventus vs AC Milan'],
 ['arg',6,'21:30','Racing Club vs Independiente'],
 ['bl',8,'19:30','Bayer Leverkusen vs RB Leipzig'],
 ['ucl',9,'20:00','FC Barcelona vs Arsenal'],
 ['nba',11,'01:00','Milwaukee Bucks vs Miami Heat'],
 ['laliga',12,'20:00','Valencia vs Real Betis'],
 ['6n',13,'15:15','France vs England'],
 ['pl',15,'15:00','Tottenham vs Newcastle'],
 ['nfl',17,'18:00','Green Bay Packers vs Detroit Lions'],
 ['pt',19,'20:30','FC Porto vs Braga'],
 ['rwc',20,'20:00','South Africa vs New Zealand']
];

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s),p=n=>String(n).padStart(2,'0');
const L=navigator.language||'en';
const key=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today=()=>add(new Date(),0);
const mon=d=>add(d,-((d.getDay()+6)%7));
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const tf=d=>d.toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'});
const df=(d,o)=>d.toLocaleDateString(L,o);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CM=Object.fromEntries(COMPS.map(c=>[c.id,c]));
const ic={l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',s:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',
 cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M12 14v4M10 16h4"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>'};
const I=(k,c='w-4 h-4')=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>`;

/* ---------- EVENTS & DATA LOADING ---------- */
const M0=mon(new Date());
let EV=[];
const S={view:'day',date:today(),sport:null,comp:null,q:'',drawer:null,dg:false,loading:true,status:null};

const fallback=()=>RAW.map(([c,o,t,title])=>{const d=add(M0,o),[h,mi]=t.split(':').map(Number);
  return{c,title,s:new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),h,mi))}});

// ---- data loading ----
let D={mode:'sample',gen:null,rep:[]};
// Runs on every page load / refresh
async function load(){
  S.loading=true;S.status=null;render();
  let d=null;
  try{const r=await fetch('./events.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!Array.isArray(j.events))throw 0;
    d={mode:'json',gen:j.generated,rep:j.report||[],list:j.events.map(e=>({c:e.c,s:new Date(e.s),title:e.title}))}}catch(_){}
  if(!d){d={mode:'sample',gen:null,rep:[],list:fallback()};S.status={t:'err',m:'events.json not found yet. Showing sample data. Run the GitHub Action once to generate it.'}}
  D=d;EV=d.list.filter(e=>CM[e.c]&&!isNaN(e.s)).sort((a,b)=>a.s-b.s).map((e,i)=>({...e,id:i,e:new Date(+e.s+CM[e.c].h*36e5)}));
  S.loading=false;render();
}
function renderDiag(){
  const g=D.gen?new Date(D.gen).toLocaleString(L,{dateStyle:'short',timeStyle:'short'}):'';
  const col=D.mode==='json'?'#10b981':'#ef4444';
  $('#pill').innerHTML=`<i class="w-2 h-2 rounded-full" style="background:${col}"></i>`+(S.loading?'Checking data…':D.mode==='json'?`Data verified: ${EV.length} events • Last updated: ${g}`:'Sample data • events.json not found');
  $('#dg').classList.toggle('hidden',!S.dg);if(!S.dg)return;
  const mark={ok:'#10b981',empty:'#f59e0b',inactive:'#f59e0b',error:'#ef4444'};
  $('#dgc').innerHTML=`<div class="flex items-center justify-between mb-3"><h3 class="font-semibold">Data diagnostics</h3><button data-dgclose class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800" aria-label="Close">${I('x','w-5 h-5')}</button></div>
  <p class="text-xs text-zinc-500 mb-3">Source: ${D.mode==='json'?'events.json (The Odds API via GitHub Action)':'built-in samples'}${g?' • '+g:''}</p>
  <ul class="grid gap-1.5 text-sm">${D.rep.length?D.rep.map(r=>`<li class="flex items-start gap-2"><i class="mt-1.5 w-2 h-2 rounded-full shrink-0" style="background:${mark[r.status]||'#888'}"></i><span class="font-medium">${esc(r.name)}</span><span class="ml-auto text-right text-zinc-500">${r.count} event${r.count===1?'':'s'}${r.status==='empty'?' · none scheduled':''}${r.status==='inactive'?' · not active':''}${r.status==='error'?' · failed':''}</span></li>${r.note?`<li class="text-xs text-zinc-500 pl-4">${esc(r.note)}</li>`:''}`).join(''):'<li class="text-zinc-500">No per-competition report for this source.</li>'}</ul>`}
ic.refresh='<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>';
$('#refresh').innerHTML=I('refresh','w-5 h-5');

const filtered=()=>{const q=S.q.trim().toLowerCase();
  return EV.filter(e=>{const c=CM[e.c];return(!S.sport||c.sp===S.sport)&&(!S.comp||e.c===S.comp)&&(!q||(e.title+' '+c.n+' '+c.s+' '+SP[c.sp].n).toLowerCase().includes(q))})};
const evs=d=>{const k=key(d);return filtered().filter(e=>key(e.s)===k)};
const gcal=e=>{const z=d=>d.toISOString().replace(/[-:]|\.\d{3}/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+z(e.s)+'/'+z(e.e)+'&details='+encodeURIComponent(CM[e.c].n+' ('+SP[CM[e.c].sp].n+') – added from DOMARA')};

/* ---------- COMPONENTS ---------- */
const tag=c=>`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300"><i class="w-1.5 h-1.5 rounded-full" style="background:${SP[c.sp].c}"></i>${SP[c.sp].n}</span>`;
const card=e=>{const c=CM[e.c];return `<article class="rounded-2xl p-3 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
  <div class="flex items-center gap-x-2 gap-y-1 flex-wrap text-xs">${tag(c)}<span class="font-semibold text-zinc-700 dark:text-zinc-300">${c.s}</span><span class="ml-auto font-semibold tabular-nums text-zinc-900 dark:text-white text-sm">${tf(e.s)}</span></div>
  <h3 class="mt-2 text-sm font-medium leading-snug">${esc(e.title)}</h3>
  <a href="${gcal(e)}" target="_blank" rel="noopener" class="mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-900 text-white dark:bg-white dark:text-black text-xs font-semibold hover:opacity-80 transition">${I('cal','w-3.5 h-3.5')}Add to Google Calendar</a></article>`};
const empty=()=>`<div class="text-center py-16 text-zinc-500"><p class="mb-3">No events scheduled for this filter/day</p>${(S.sport||S.comp||S.q)?'<button data-reset class="px-4 py-2 rounded-full bg-emerald-500 text-black text-sm font-semibold">Reset filters</button>':''}</div>`;
const skel=()=>`<div class="grid gap-2 md:grid-cols-2 lg:grid-cols-3">${[...Array(6)].map(()=>'<div class="h-28 rounded-2xl bg-zinc-200 dark:bg-zinc-900 animate-pulse"></div>').join('')}</div>`;

const dayV=()=>{const l=evs(S.date);return l.length?`<div class="grid gap-2 md:grid-cols-2 lg:grid-cols-3">${l.map(card).join('')}</div>`:empty()};
const weekV=()=>{const m=mon(S.date);let any=false;
  const cols=[...Array(7)].map((_,i)=>{const d=add(m,i),l=evs(d);any=any||l.length;const t=key(d)===key(today());
    return `<section id="wd-${key(d)}" class="scroll-mt-28 md:min-w-0"><h3 class="mb-2 text-sm font-semibold ${t?'text-emerald-500':'text-zinc-500'}">${df(d,{weekday:'short'})} ${d.getDate()}${t?' · Today':''}</h3><div class="grid gap-2">${l.length?l.map(card).join(''):'<p class="text-xs text-zinc-500 py-2">No events</p>'}</div></section>`}).join('');
  return any?`<div class="grid gap-4 md:grid-cols-7">${cols}</div>`:empty()};
const monthV=()=>{const f=new Date(S.date.getFullYear(),S.date.getMonth(),1),last=new Date(f.getFullYear(),f.getMonth()+1,0);
  const hd=[...Array(7)].map((_,i)=>`<div class="text-center text-xs text-zinc-500 py-1">${df(add(M0,i),{weekday:'short'})}</div>`).join('');
  let d=mon(f),cells='';
  while(d<=last||d.getDay()!==1){const l=evs(d),inM=d.getMonth()===f.getMonth(),t=key(d)===key(today());
    const dots=[...new Set(l.map(e=>CM[e.c].sp))].slice(0,4).map(id=>`<i class="w-1.5 h-1.5 rounded-full" style="background:${SP[id].c}"></i>`).join('');
    cells+=`<button data-open="${key(d)}" class="min-h-[64px] md:min-h-[92px] p-1.5 rounded-xl text-left flex flex-col border ${t?'border-emerald-500':'border-zinc-200 dark:border-zinc-800'} ${inM?'bg-white dark:bg-zinc-900':'opacity-40'} hover:border-emerald-500 transition">
      <span class="text-sm ${t?'font-bold text-emerald-500':''}">${d.getDate()}</span>
      ${l.length?`<span class="mt-auto flex items-center gap-1 flex-wrap">${dots}<span class="ml-auto text-[10px] font-semibold text-zinc-500">${l.length}</span></span>`:''}</button>`;
    d=add(d,1)}
  return `<div class="grid grid-cols-7 gap-1">${hd}${cells}</div>`};

/* ---------- RENDER ---------- */
const seg=on=>`px-4 py-1.5 rounded-full transition ${on?'bg-white dark:bg-zinc-700 shadow font-semibold':'text-zinc-500'}`;
function renderStrip(){const el=$('#strip');
  if(S.view!=='day'){el.innerHTML='';return}
  const m=mon(S.date);
  el.innerHTML=`<div class="grid grid-cols-7 gap-1">${[...Array(7)].map((_,i)=>{const d=add(m,i),k=key(d),sel=k===key(S.date),t=k===key(today()),n=evs(d).length;
    return `<button data-day="${k}" class="py-1.5 rounded-xl text-center transition ${sel?'bg-emerald-500 text-black':'hover:bg-zinc-200 dark:hover:bg-zinc-800'}">
      <div class="text-[11px] ${sel?'':'text-zinc-500'}">${t?'Today':df(d,{weekday:'short'})}</div><div class="text-base font-semibold leading-tight">${d.getDate()}</div>
      <div class="h-1.5 mt-0.5 flex justify-center">${n?`<i class="w-1.5 h-1.5 rounded-full ${sel?'bg-black':'bg-emerald-500'}"></i>`:''}</div></button>`}).join('')}</div>`}
function renderFilters(){
  const cls=(on,em)=>`shrink-0 px-3 py-1.5 rounded-full text-sm border transition ${on?(em?'bg-emerald-500 text-black border-emerald-500 font-semibold':'bg-zinc-900 text-white dark:bg-white dark:text-black border-transparent font-semibold'):'border-zinc-300 dark:border-zinc-700 text-zinc-600 dark:text-zinc-400 hover:border-emerald-500'}`;
  $('#sports').innerHTML=[['','All'],...Object.entries(SP).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button data-sport="${k}" class="${cls(S.sport===(k||null))}">${n}</button>`).join('');
  $('#chips').innerHTML=S.sport?`<button data-comp="" class="${cls(!S.comp,1)}">All ${SP[S.sport].n}</button>`+COMPS.filter(c=>c.sp===S.sport).map(c=>`<button data-comp="${c.id}" class="${cls(S.comp===c.id,1)}">${c.s}</button>`).join(''):'';
  $('#chips').classList.toggle('hidden',!S.sport)}
function renderStatus(){const s=S.status;$('#bar').classList.toggle('hidden',!S.loading);
  $('#status').innerHTML=S.loading?'<p class="pt-2 text-xs text-zinc-500">Loading fixtures…</p>':s?`<div class="mt-2 flex items-center gap-2 text-xs rounded-xl px-3 py-2 ${s.t==='err'?'bg-amber-500/10 text-amber-600 dark:text-amber-400':'bg-zinc-200 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400'}"><span>${s.m}</span>${s.noRetry?'':'<button data-retry class="ml-auto font-semibold underline">Retry</button>'}</div>`:''}
function renderMain(){const v=S.view,d=S.date;
  const label=v==='day'?df(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):v==='week'?`${df(mon(d),{day:'numeric',month:'short'})} – ${df(add(mon(d),6),{day:'numeric',month:'short',year:'numeric'})}`:df(d,{month:'long',year:'numeric'});
  $('#main').innerHTML=`<div class="flex items-center justify-between mb-3"><button data-nav="-1" class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800" aria-label="Previous">${I('l','w-5 h-5')}</button><h2 class="font-semibold capitalize text-center">${label}</h2><button data-nav="1" class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800" aria-label="Next">${I('r','w-5 h-5')}</button></div><div class="fade">${S.loading?skel():v==='day'?dayV():v==='week'?weekV():monthV()}</div>`;
  if(v==='week'&&matchMedia('(max-width:767px)').matches)document.getElementById('wd-'+key(today()))?.scrollIntoView({block:'start'})}
function renderDrawer(){const el=$('#dr');
  if(!S.drawer){el.classList.add('hidden');return}
  const d=fromKey(S.drawer),l=evs(d);
  $('#drc').innerHTML=`<div class="flex items-center justify-between mb-3"><h3 class="font-semibold capitalize">${df(d,{weekday:'long',day:'numeric',month:'long'})}</h3><button data-close class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800" aria-label="Close">${I('x','w-5 h-5')}</button></div><div class="grid gap-2">${l.length?l.map(card).join(''):empty()}</div>`;
  el.classList.remove('hidden')}
function render(){document.querySelectorAll('[data-v]').forEach(b=>b.className=seg(b.dataset.v===S.view));
  document.querySelector('[data-v]').parentElement.className='inline-flex p-0.5 rounded-full bg-zinc-200 dark:bg-zinc-900 text-sm';
  renderStrip();renderFilters();renderStatus();renderMain();renderDrawer();renderDiag()}
function shift(n){const d=S.date;S.date=S.view==='day'?add(d,n):S.view==='week'?add(d,7*n):new Date(d.getFullYear(),d.getMonth()+n,1);render()}

/* ---------- EVENTS & INIT ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-nav],[data-day],[data-sport],[data-retry],[data-dg],[data-dgclose],[data-refresh],[data-comp],[data-open],[data-reset],[data-close],[data-today]');if(!t)return;
  if(t.dataset.v){S.view=t.dataset.v;if(S.view==='month')S.date=new Date(S.date.getFullYear(),S.date.getMonth(),S.date.getDate())}
  else if('nav' in t.dataset)return shift(+t.dataset.nav);
  else if(t.dataset.day)S.date=fromKey(t.dataset.day);
  else if('retry' in t.dataset||'refresh' in t.dataset)return load();
  else if('dg' in t.dataset||'dgclose' in t.dataset)S.dg='dg' in t.dataset;
  else if('sport' in t.dataset){S.sport=t.dataset.sport||null;S.comp=null}
  else if('comp' in t.dataset)S.comp=t.dataset.comp&&S.comp!==t.dataset.comp?t.dataset.comp:null;
  else if(t.dataset.open){S.drawer=t.dataset.open;S.date=fromKey(t.dataset.open)}
  else if('reset' in t.dataset){S.sport=null;S.comp=null;S.q='';$('#q').value=''}
  else if('close' in t.dataset)S.drawer=null;
  else if('today' in t.dataset){S.date=today();S.drawer=null}
  render()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderStrip();renderMain();renderDrawer()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'&&S.drawer){S.drawer=null;renderDrawer()}
  else if(!S.drawer&&e.key==='ArrowLeft')shift(-1);else if(!S.drawer&&e.key==='ArrowRight')shift(1)});
let tx=0;const mn=$('#main');
mn.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
mn.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(S.view!=='month'&&Math.abs(dx)>70)shift(dx<0?1:-1)});
const setTheme=dark=>{document.documentElement.classList.toggle('dark',dark);$('#theme').innerHTML=I(dark?'sun':'moon','w-5 h-5');try{localStorage.setItem('domara-theme',dark?'dark':'light')}catch(_){}};
$('#theme').onclick=()=>setTheme(!document.documentElement.classList.contains('dark'));
let saved=null;try{saved=localStorage.getItem('domara-theme')}catch(_){}
setTheme(saved!=='light');
$('#sicon').innerHTML=I('s');
load(); // events.json first, then samples; runs on every load
</script>
</body>
</html>
