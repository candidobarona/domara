    <circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="24" cy="24" rx="16" ry="7.5" transform="rotate(-35 24 24)" stroke="#10b981" stroke-width="3"/>
  </g>
  <!-- Wordmark (convert text to outlines in Figma/Illustrator for production use) -->
  <text x="58" y="33" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="27" letter-spacing="5" fill="currentColor">DOMARA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
