<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 48" fill="none" role="img" aria-label="DOMARA" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Isotype: ball ring crossed by an oval/stadium track (multi-sport) -->
