name: Fetch odds schedule
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # manual "Run workflow" button
permissions:
  contents: write
concurrency:
  group: fetch-odds-schedule
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch schedule (key comes from GitHub Secrets, never from the repo)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node update_schedule.js
      - name: Commit events.json only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --staged --quiet || (git commit -m "chore: update events.json" && git push)
